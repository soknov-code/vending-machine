<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickDrink Vending</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e60000">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        
        .header {
            background-color: #e60000;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { font-size: 14px; opacity: 0.9; }

        .container { padding: 20px; max-width: 500px; margin: 0 auto; }
        
        .drink-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .drink-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .drink-card:active { transform: scale(0.95); }

        .drink-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .drink-name { font-weight: bold; margin-bottom: 5px; font-size: 16px; }
        .drink-price { color: #e60000; font-weight: bold; margin-bottom: 15px; font-size: 14px; }

        .buy-btn {
            background-color: #000;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        /* ផ្ទាំងលោតបញ្ជាក់ (Modal) */
        #status-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #e60000;
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>QuickDrink</h1>
        <p>ម៉ាស៊ីនលក់ភេសជ្ជៈ - សាខាទី១</p>
    </div>

    <div class="container">
        <h3>សូមជ្រើសរើសភេសជ្ជៈ៖</h3>
        
        <div class="drink-grid">
            <div class="drink-card">
                <div class="drink-icon">🥤</div>
                <div class="drink-name">កូកាកូឡា</div>
                <div class="drink-price">2500 ៛</div>
                <button class="buy-btn" onclick="buyDrink('DROP_ROW_1', 'កូកាកូឡា')">ទិញ (Buy)</button>
            </div>

            <div class="drink-card">
                <div class="drink-icon">⚡</div>
                <div class="drink-name">ស្ទីង (Sting)</div>
                <div class="drink-price">2500 ៛</div>
                <button class="buy-btn" onclick="buyDrink('DROP_ROW_2', 'ស្ទីង')">ទិញ (Buy)</button>
            </div>

            <div class="drink-card">
                <div class="drink-icon">🍵</div>
                <div class="drink-name">តែបៃតង</div>
                <div class="drink-price">3000 ៛</div>
                <button class="buy-btn" onclick="buyDrink('DROP_ROW_3', 'តែបៃតង')">ទិញ (Buy)</button>
            </div>

            <div class="drink-card">
                <div class="drink-icon">💧</div>
                <div class="drink-name">ទឹកបរិសុទ្ធ</div>
                <div class="drink-price">1000 ៛</div>
                <button class="buy-btn" onclick="buyDrink('DROP_ROW_4', 'ទឹកបរិសុទ្ធ')">ទិញ (Buy)</button>
            </div>
        </div>
    </div>

    <div id="status-modal">
        <div class="modal-content">
            <div class="loader" id="loader"></div>
            <h3 id="modal-text">កំពុងដំណើរការ...</h3>
            <p id="modal-subtext" style="font-size: 12px; color: gray; margin-top: 10px;">សូមរង់ចាំការបញ្ជាក់ពីធនាគារ</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
